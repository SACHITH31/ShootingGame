<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Shooting Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #score { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <script>
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const playerImg = new Image();
    playerImg.src = 'https://i.ibb.co/0Gq2v6F/human-icon.png';

    let player = { x: canvas.width/2 - 20, y: canvas.height-60, width: 40, height: 60, speed: 7 };
    let bullets = [];
    let enemies = [];
    let score = 0;

    let keys = { left: false, right: false, space: false };

    function spawnEnemy() {
      enemies.push({
        x: Math.random() * (canvas.width-30),
        y: -20,
        width: 30,
        height: 30,
        speed: 2 + Math.random() * 4
      });
    }

    setInterval(spawnEnemy, 800); // more frequent spawn

    function drawPlayer() {
      ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
    }

    function drawBullets() {
      ctx.fillStyle = 'yellow';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
    }

    function drawEnemies() {
      ctx.fillStyle = 'red';
      enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));
    }

    function update() {
      // Player movement
      if(keys.left && player.x > 0) player.x -= player.speed;
      if(keys.right && player.x < canvas.width - player.width) player.x += player.speed;

      // Shooting bullets continuously
      if(keys.space && bullets.length < 20) {
        bullets.push({ x: player.x + player.width/2 - 5, y: player.y + 10, width: 10, height: 20, speed: 10 });
      }

      // Update bullets
      bullets.forEach(b => b.y -= b.speed);
      bullets = bullets.filter(b => b.y + b.height > 0);

      // Update enemies
      enemies.forEach(e => e.y += e.speed);
      enemies = enemies.filter(e => e.y < canvas.height);

      // Collision detection
      for(let i = enemies.length-1; i>=0; i--) {
        for(let j = bullets.length-1; j>=0; j--) {
          if (bullets[j].x < enemies[i].x + enemies[i].width &&
              bullets[j].x + bullets[j].width > enemies[i].x &&
              bullets[j].y < enemies[i].y + enemies[i].height &&
              bullets[j].y + bullets[j].height > enemies[i].y) {
                bullets.splice(j,1);
                enemies.splice(i,1);
                score++;
                document.getElementById('score').innerText = 'Score: ' + score;
                break;
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawPlayer();
      drawBullets();
      drawEnemies();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', e => {
      if(e.key === 'ArrowLeft') keys.left = true;
      if(e.key === 'ArrowRight') keys.right = true;
      if(e.key === ' ') keys.space = true;
    });

    document.addEventListener('keyup', e => {
      if(e.key === 'ArrowLeft') keys.left = false;
      if(e.key === 'ArrowRight') keys.right = false;
      if(e.key === ' ') keys.space = false;
    });

    gameLoop();
  </script>
</body>
</html>
