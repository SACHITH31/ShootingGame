<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realistic Shooting Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #score { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <script>
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const playerImg = new Image();
    playerImg.src = 'https://i.ibb.co/0Gq2v6F/human-icon.png'; // 2D human icon

    const bulletImg = new Image();
    bulletImg.src = 'https://i.ibb.co/Yc0TjXz/bullet.png'; // small bullet icon

    const explosionImg = new Image();
    explosionImg.src = 'https://i.ibb.co/3vG3Tq8/explosion.png'; // explosion icon

    let player = { x: canvas.width/2 - 20, y: canvas.height-60, width: 40, height: 60, speed: 7 };
    let bullets = [];
    let enemies = [];
    let explosions = [];
    let score = 0;

    let keys = { left: false, right: false, space: false };

    function spawnEnemy() {
      enemies.push({
        x: Math.random() * (canvas.width-40),
        y: -40,
        width: 40,
        height: 40,
        speed: 2 + Math.random() * 3,
        color: `rgb(${Math.random()*255},0,0)`
      });
    }

    setInterval(spawnEnemy, 700);

    function drawPlayer() {
      ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
    }

    function drawBullets() {
      bullets.forEach(b => ctx.drawImage(bulletImg, b.x, b.y, b.width, b.height));
    }

    function drawEnemies() {
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.width, e.height);
      });
    }

    function drawExplosions() {
      explosions.forEach((exp, i) => {
        ctx.drawImage(explosionImg, exp.x, exp.y, 40, 40);
        exp.frame++;
        if(exp.frame > 10) explosions.splice(i, 1);
      });
    }

    function update() {
      if(keys.left && player.x > 0) player.x -= player.speed;
      if(keys.right && player.x < canvas.width - player.width) player.x += player.speed;

      if(keys.space && bullets.length < 20) {
        bullets.push({ x: player.x + player.width/2 - 5, y: player.y, width: 10, height: 20, speed: 10 });
      }

      bullets.forEach(b => b.y -= b.speed);
      bullets = bullets.filter(b => b.y + b.height > 0);

      enemies.forEach(e => e.y += e.speed);
      enemies = enemies.filter(e => e.y < canvas.height);

      // Collision detection
      for(let i = enemies.length-1; i>=0; i--) {
        for(let j = bullets.length-1; j>=0; j--) {
          if (bullets[j].x < enemies[i].x + enemies[i].width &&
              bullets[j].x + bullets[j].width > enemies[i].x &&
              bullets[j].y < enemies[i].y + enemies[i].height &&
              bullets[j].y + bullets[j].height > enemies[i].y) {
                explosions.push({ x: enemies[i].x, y: enemies[i].y, frame: 0 });
                bullets.splice(j,1);
                enemies.splice(i,1);
                score++;
                document.getElementById('score').innerText = 'Score: ' + score;
                break;
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawPlayer();
      drawBullets();
      drawEnemies();
      drawExplosions();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', e => {
      if(e.key === 'ArrowLeft') keys.left = true;
      if(e.key === 'ArrowRight') keys.right = true;
      if(e.key === ' ') keys.space = true;
    });

    document.addEventListener('keyup', e => {
      if(e.key === 'ArrowLeft') keys.left = false;
      if(e.key === 'ArrowRight') keys.right = false;
      if(e.key === ' ') keys.space = false;
    });

    gameLoop();
  </script>
</body>
</html>
